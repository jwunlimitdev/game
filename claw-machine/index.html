<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>인형뽑기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1a1030;color:#fff;font-family:system-ui,"Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px;user-select:none;-webkit-user-select:none}
h1{margin:6px 0;font-size:24px}
#shops{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
#shops button{font-size:13px;padding:8px 10px;min-width:0;background:#4a3778}
#shops button.active{background:#ff6fa5}
#shopInfo{font-size:13px;color:#cfc3f0;margin-bottom:6px}
#hud{display:flex;gap:14px;margin-bottom:8px;font-size:15px;flex-wrap:wrap;justify-content:center}
#hud b{color:#ffe066}
canvas{border-radius:12px;max-width:100%;height:auto;touch-action:none}
#controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
button{font-size:18px;padding:12px 18px;border:none;border-radius:10px;background:#ff6fa5;color:#fff;font-weight:bold;cursor:pointer;min-width:72px;touch-action:manipulation}
button.side{background:#6fb8ff}
button.drop{background:#ffb84d;min-width:110px}
button.dex{background:#7ed957;font-size:15px}
button:disabled{background:#555;cursor:default}
#msg{height:26px;margin-top:8px;font-size:16px;color:#ffe066;text-align:center}
#dex{width:100%;max-width:480px;margin-top:12px;background:#2b1b4d;border-radius:12px;padding:12px}
#dex h2{margin:0 0 8px;font-size:18px}
#dexGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#3a2366;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px}
.cell .dot{width:36px;height:36px;border-radius:50%;margin:0 auto 4px;border:2px solid #222}
.cell.off{opacity:.6}
</style>
</head>
<body>
<h1>🧸 인형뽑기</h1>
<div id="shops"></div>
<div id="shopInfo"></div>
<div id="hud">
  <span>코인 <b id="coins">0</b></span>
  <span>점수 <b id="score">0</b></span>
  <span>획득 <b id="prizes">0</b></span>
  <span>도감 <b id="dexCount">0</b>/20</span>
</div>
<canvas id="c" width="480" height="640"></canvas>
<div id="controls">
  <button class="side" id="left">◀</button>
  <button class="drop" id="drop">내려보내기</button>
  <button class="side" id="right">▶</button>
  <button id="recharge">코인 +5</button>
</div>
<div id="msg"></div>
<button class="dex" id="toggleDex">📖 도감 열기</button>
<div id="dex" hidden>
  <h2>📖 인형 도감</h2>
  <div id="dexGrid"></div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 640;
const TOP = 90, FLOOR = 500, DROP_Y = 455, BIN_X = 400, MIN_X = 50, MAX_X = 430;

// 인형 20종 (0~7 일반, 8~14 레어, 15~19 에픽)
const RAW_DOLLS = [
  ['토끼', '#ffffff', 0], ['곰', '#c98b5a', 0], ['고양이', '#ffb088', 0], ['강아지', '#e6c28c', 0],
  ['펭귄', '#2d3e5c', 0], ['오리', '#ffd166', 0], ['돼지', '#ffb3c6', 0], ['개구리', '#7ed957', 0],
  ['햄스터', '#f2c29b', 1], ['여우', '#ff9a3c', 1], ['판다', '#eeeeee', 1], ['코알라', '#a9b4c2', 1],
  ['사자', '#ffcf5c', 1], ['기린', '#f5d36b', 1], ['공룡', '#6fd3a0', 1],
  ['유니콘', '#ffd6f0', 2], ['드래곤', '#ff5c5c', 2], ['로봇', '#9fb4c7', 2], ['천사', '#fff8c4', 2], ['요정', '#c59bff', 2]
];
const TIER_VALUE = [100, 300, 500], TIER_GRIP = [0.55, 0.4, 0.28], TIER_R = [22, 25, 28];
const DOLL_TYPES = RAW_DOLLS.map(([name, color, tier]) => ({
  name, color, tier, value: TIER_VALUE[tier], grip: TIER_GRIP[tier], r: TIER_R[tier]
}));

// 인형뽑기 가게 5곳
const SHOPS = [
  { name: '1호점 동네',   cost: 1, grip: 1.0,  minTier: 0, bg: '#2b1b4d', skin: '#ff6fa5' },
  { name: '2호점 놀이터', cost: 1, grip: 1.1,  minTier: 0, bg: '#1d3b4d', skin: '#6fb8ff' },
  { name: '3호점 시내',   cost: 2, grip: 1.2,  minTier: 1, bg: '#3d2b1d', skin: '#ffb84d' },
  { name: '4호점 쇼핑몰', cost: 2, grip: 1.35, minTier: 1, bg: '#1d4d2b', skin: '#7ee8a0' },
  { name: '5호점 프리미엄', cost: 3, grip: 1.5, minTier: 2, bg: '#4d1d3d', skin: '#c59bff' }
];

let shopIdx = 0, state, clawX, clawY, clawOpen, dir, grabT, dolls, held;
let coins, score, prizes, msgTimer = 0;
let collection = loadCollection();

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function loadCollection() {
  try { return new Set(JSON.parse(localStorage.getItem('clawCollection') || '[]')); }
  catch (e) { return new Set(); }
}
function saveCollection() {
  try { localStorage.setItem('clawCollection', JSON.stringify([...collection])); } catch (e) {}
}

function shopPool() {
  const s = SHOPS[shopIdx];
  return DOLL_TYPES.filter(t => t.tier >= s.minTier);
}

function makeDoll() {
  const pool = shopPool();
  const t = pool[Math.floor(Math.random() * pool.length)];
  return { t, r: t.r, x: rand(60, 360), y: FLOOR - t.r };
}

function fillDolls(n) {
  while (dolls.length < n) dolls.push(makeDoll());
}

function setMsg(text) {
  document.getElementById('msg').textContent = text;
  msgTimer = 120;
}

function updHud() {
  document.getElementById('coins').textContent = coins;
  document.getElementById('score').textContent = score;
  document.getElementById('prizes').textContent = prizes;
  document.getElementById('dexCount').textContent = collection.size;
}

function renderShops() {
  const box = document.getElementById('shops');
  box.innerHTML = '';
  SHOPS.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '호점';
    if (i === shopIdx) b.className = 'active';
    b.onclick = () => switchShop(i);
    box.appendChild(b);
  });
  const s = SHOPS[shopIdx];
  document.getElementById('shopInfo').textContent =
    s.name + ' · 1판 ' + s.cost + '코인 · 잡기 보정 x' + s.grip.toFixed(2);
}

function applyTheme() {
  cv.style.background = SHOPS[shopIdx].bg;
  renderShops();
}

function enterShop() {
  state = 'idle';
  clawX = 240; clawY = TOP; clawOpen = true; dir = 0; grabT = 0;
  dolls = []; held = null;
  fillDolls(10);
  applyTheme();
  setMsg(SHOPS[shopIdx].name + '에 오신 것을 환영합니다!');
}

function switchShop(i) {
  if (state !== 'idle' || held) { setMsg('인형을 다 꺼낸 뒤에 가게를 옮길 수 있어요'); return; }
  if (i === shopIdx) return;
  shopIdx = i;
  enterShop();
  updHud();
}

function drop() {
  if (state !== 'idle') return;
  const s = SHOPS[shopIdx];
  if (coins < s.cost) { setMsg('코인이 부족해요! (필요 ' + s.cost + '개)'); return; }
  coins -= s.cost; updHud();
  state = 'down'; clawY = TOP; clawOpen = true;
}

function tryGrab() {
  const s = SHOPS[shopIdx];
  const cand = dolls
    .filter(d => Math.abs(d.x - clawX) < d.r + 8)
    .sort((a, b) => Math.abs(a.x - clawX) - Math.abs(b.x - clawX))[0];
  if (cand && Math.random() < Math.min(0.95, cand.t.grip * s.grip)) {
    held = cand;
    dolls = dolls.filter(d => d !== cand);
    setMsg(cand.t.name + ' 잡았다! 위로 올라갑니다');
  } else {
    setMsg(cand ? '아쉽! 놓쳤어요' : '헛탕! 아무것도 없어요');
  }
}

function release() {
  const name = held.t.name;
  score += held.t.value;
  prizes++;
  let extra = '';
  if (!collection.has(name)) {
    collection.add(name);
    saveCollection();
    coins += 3;
    extra = ' 🆕 도감 등록! 코인 +3';
    renderDex();
  }
  setMsg(name + ' 획득! +' + held.t.value + '점' + extra);
  held = null;
  fillDolls(10);
  updHud();
}

function renderDex() {
  const grid = document.getElementById('dexGrid');
  grid.innerHTML = DOLL_TYPES.map(t => {
    const on = collection.has(t.name);
    return '<div class="cell' + (on ? '' : ' off') + '">' +
      '<div class="dot" style="background:' + (on ? t.color : '#444') + '"></div>' +
      (on ? t.name : '???') + '</div>';
  }).join('');
  updHud();
}

function update() {
  if (msgTimer > 0 && --msgTimer === 0 && state === 'idle' && coins < SHOPS[shopIdx].cost) {
    setMsg('코인이 부족해요! 코인을 충전하세요');
  }
  if (state === 'idle') {
    if (dir) clawX = clamp(clawX + dir * 3, MIN_X, MAX_X);
  } else if (state === 'down') {
    clawY += 4;
    if (clawY >= DROP_Y) { clawY = DROP_Y; state = 'grab'; grabT = 0; clawOpen = false; tryGrab(); }
  } else if (state === 'grab') {
    if (++grabT > 30) state = 'up';
  } else if (state === 'up') {
    clawY -= 3;
    if (clawY <= TOP) { clawY = TOP; state = held ? 'move' : 'idle'; }
  } else if (state === 'move') {
    clawX += 4;
    if (clawX >= BIN_X) {
      clawX = BIN_X;
      if (held) release();
      state = 'idle';
    }
  }
  if (held) { held.x = clawX; held.y = clawY + 30; }
}

function drawDoll(d) {
  const { x, y, r } = d;
  const color = d.t.color;
  const name = d.t.name;
  ctx.fillStyle = color;
  if (name === '고양이' || name === '여우' || name === '드래곤') {
    ctx.beginPath(); ctx.moveTo(x - r * 1.0, y - r * 0.5); ctx.lineTo(x - r * 0.6, y - r * 1.2); ctx.lineTo(x - r * 0.2, y - r * 0.7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + r * 1.0, y - r * 0.5); ctx.lineTo(x + r * 0.6, y - r * 1.2); ctx.lineTo(x + r * 0.2, y - r * 0.7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x - r * 0.7, y - r * 0.8, r * 0.38, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.7, y - r * 0.8, r * 0.38, 0, Math.PI * 2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.35, y - r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.25, 0.1, Math.PI - 0.1); ctx.stroke();
  if (name === '유니콘') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(x, y - r * 1.7); ctx.lineTo(x - 5, y - r * 0.9); ctx.lineTo(x + 5, y - r * 0.9); ctx.fill();
  }
  if (name === '천사') {
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y - r * 1.4, r * 0.5, r * 0.15, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawClaw() {
  const s = SHOPS[shopIdx];
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(clawX, TOP - 20); ctx.lineTo(clawX, clawY); ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.fillRect(clawX - 14, clawY - 12, 28, 14);
  const spread = clawOpen ? 20 : 6;
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  [-1, 0, 1].forEach(i => {
    ctx.beginPath();
    ctx.moveTo(clawX + i * 6, clawY + 2);
    ctx.lineTo(clawX + i * spread, clawY + 26);
    ctx.stroke();
  });
}

function draw() {
  const s = SHOPS[shopIdx];
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = s.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = s.skin;
  ctx.fillRect(20, TOP - 40, W - 40, 16);
  ctx.fillStyle = 'rgba(160,220,255,0.08)';
  ctx.fillRect(20, TOP - 20, W - 40, FLOOR - TOP + 40);
  ctx.fillStyle = '#6b4a9b';
  ctx.fillRect(20, FLOOR, W - 40, H - FLOOR - 60);
  ctx.fillStyle = '#111';
  ctx.fillRect(BIN_X - 30, FLOOR + 10, 60, 40);
  ctx.fillStyle = '#ffe066'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('배출구', BIN_X, FLOOR + 66);

  dolls.forEach(drawDoll);
  drawClaw();
  if (held) drawDoll(held);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// 입력 - 키보드
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') dir = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd') dir = 1;
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); drop(); }
});
document.addEventListener('keyup', e => {
  if (['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) dir = 0;
});

// 입력 - 버튼 (누르고 있으면 계속 이동)
function bindHold(id, d) {
  const el = document.getElementById(id);
  const start = e => { e.preventDefault(); dir = d; };
  const stop = () => { dir = 0; };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
}
bindHold('left', -1);
bindHold('right', 1);
document.getElementById('drop').onclick = drop;
document.getElementById('recharge').onclick = () => {
  coins += 5; updHud(); setMsg('코인 5개를 충전했어요!');
};
document.getElementById('toggleDex').onclick = () => {
  const dex = document.getElementById('dex');
  dex.hidden = !dex.hidden;
  document.getElementById('toggleDex').textContent = dex.hidden ? '📖 도감 열기' : '📖 도감 닫기';
};

// 시작
coins = 10; score = 0; prizes = 0;
enterShop();
renderDex();
updHud();
loop();
</script>
</body>
</html>
