<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>인형뽑기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🧸 인형뽑기</h1>
<div id="shops"></div>
<div id="shopInfo"></div>
<div id="hud">
  <span>코인 <b id="coins">0</b></span>
  <span>점수 <b id="score">0</b></span>
  <span>획득 <b id="prizes">0</b></span>
  <span>도감 <b id="dexCount">0</b>/20</span>
</div>
<canvas id="c" width="480" height="640"></canvas>
<div id="controls">
  <button class="side" id="left">◀</button>
  <button class="drop" id="drop">내려보내기</button>
  <button class="side" id="right">▶</button>
</div>
<div id="msg"></div>
<div class="tabs">
  <button class="panel" id="toggleDex">📖 도감 열기</button>
  <button class="panel" id="toggleMission">🎯 미션 열기</button>
</div>
<div id="dex" class="panel-box" hidden>
  <h2>📖 인형 도감</h2>
  <div id="dexGrid"></div>
</div>
<div id="mission" class="panel-box" hidden>
  <h2>🎯 미션 (클리어 시 코인 보상)</h2>
  <div id="missionList"></div>
</div>

<script src="shops.js"></script>
<script src="game.js"></script>
</body>
</html>
