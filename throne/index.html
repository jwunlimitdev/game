<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쓰론폴 (Throne Fall)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>쓰론폴</h1>
<div id="status"></div>
<div id="msg"></div>
<div id="grid"></div>

<div class="row" id="palette">
  <button data-b="farm" onclick="pick('farm')">🌾 농장 20G</button>
  <button data-b="mine" onclick="pick('mine')">⛏️ 광산 25G</button>
  <button data-b="barracks" onclick="pick('barracks')">🏹 병영 30G</button>
  <button data-b="lab" onclick="pick('lab')">🧪 연구소 40G</button>
</div>
<div class="row">
  <button onclick="recruit()">병사 모집 (10G)</button>
  <button onclick="repair()">성벽 보수 (30G)</button>
  <button onclick="research()">연구 진행</button>
  <button id="nightBtn" class="night" onclick="night()">🌙 밤 맞이하기</button>
</div>
<div class="row">
  <label>난이도
    <select id="diff" onchange="init(this.value)">
      <option value="easy">쉬움</option>
      <option value="normal" selected>보통</option>
      <option value="hard">어려움</option>
    </select>
  </label>
  <button onclick="init($('diff').value)">새 게임</button>
</div>

<div id="help">
  낮: 건물을 짓고(칸 클릭), 병사를 모집하고, 연구를 진행합니다. 농장은 식량, 광산은 골드를 줍니다.<br>
  밤: 적의 습격을 받습니다. 병력이 적을 격퇴하고, 남은 적은 성벽을 공격합니다. 성벽이 무너지면 패배합니다.<br>
  목표: 10일을 버텨 왕국을 지키세요. 경제에 투자하면 건물이 늘지만, 방어를 소홀히 하면 왕국이 위험해집니다.
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
