<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 게임</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1b1f2a;color:#f2f2f2;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
body.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
h1{margin:8px 0 12px;font-size:24px}
.wallet{display:flex;align-items:center;gap:12px;background:#2a3150;border-radius:14px;padding:12px 16px;width:100%;max-width:520px;justify-content:space-between}
.wallet strong{font-size:20px;color:#facc15}
.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.tabs button,.btn{background:#2f3650;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
.tabs button.active,.btn.active{background:#f5b700;color:#222;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:6px 10px;font-size:12px}
.panel{display:none;width:100%;max-width:520px;text-align:center}
.panel.active{display:block}
.missions{width:100%;max-width:520px;background:#222841;border-radius:14px;padding:12px 16px;margin-bottom:6px}
.missions h2{margin:0 0 8px;font-size:15px;color:#c7d2fe}
.mission{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#b9bfd6}
.mission.done{color:#86efac;text-decoration:line-through;opacity:.8}
.mission span:last-child{font-weight:700;color:#facc15}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:14px}
.num{aspect-ratio:1;border-radius:50%;border:0;background:#3a4262;color:#fff;font-size:14px;cursor:pointer}
.num.sel{background:#f5b700;color:#222;font-weight:700}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.balls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:64px;margin:16px 0}
.ball{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;animation:pop .4s ease}
.ball.bonus{outline:3px dashed #fff;outline-offset:2px}
@keyframes pop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.c1{background:#f0a500}.c2{background:#3b82f6}.c3{background:#ef4444}.c4{background:#6b7280}.c5{background:#22c55e}
.result{font-size:18px;margin-top:12px;min-height:28px;font-weight:700}
.info{color:#b9bfd6;font-size:13px;line-height:1.6}
.odds{background:#222841;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:12px;color:#c7d2fe;line-height:1.9}
.scratch-wrap{position:relative;width:300px;height:140px;margin:16px auto;border-radius:12px;overflow:hidden;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
canvas.scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.msg{min-height:28px;font-size:18px;font-weight:700;margin:10px 0}
.toast{min-height:22px;color:#facc15;font-size:14px;font-weight:700;margin:6px 0}
.bankrupt{color:#fca5a5;font-size:14px;min-height:20px;margin:6px 0}
.sub{font-size:13px;color:#c7d2fe;margin:14px 0 6px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<h1>🎱 로또 게임</h1>

<div class="wallet">
  <div>💰 잔액 <strong id="money"></strong></div>
  <button class="btn small" id="resetAll">처음부터</button>
</div>

<div class="missions">
  <h2>🎯 미션</h2>
  <div id="missionList"></div>
</div>
<div class="toast" id="toast"></div>
<div class="bankrupt" id="bankrupt"></div>

<div class="tabs">
  <button data-tab="pick" class="active">번호 추첨</button>
  <button data-tab="scratchPanel">복권 긁기</button>
  <button data-tab="predictPanel">예측 복권</button>
</div>

<div id="pick" class="panel active">
  <p class="info" id="pickInfo"></p>
  <p class="info">1장 1,000원 · 2개 이상 맞으면 당첨 (약 17.5%)</p>
  <div class="odds">
    1등 28억 (약 0.00001%) · 2등 500만 (약 0.00007%)<br>
    3등 150만 (약 0.003%) · 4등 5만 (약 0.14%)<br>
    5등 3만 (약 2.2%) · 6등 5천 (약 15.1%)
  </div>
  <div class="grid" id="grid"></div>
  <div class="row">
    <button class="btn" id="autoBtn">자동 선택</button>
    <button class="btn" id="resetBtn">초기화</button>
    <button class="btn" id="drawBtn" disabled>추첨하기</button>
  </div>
  <div class="balls" id="balls"></div>
  <div class="result" id="result"></div>
</div>

<div id="scratchPanel" class="panel">
  <p class="info">첫 복권(행운 복권)은 무료예요. 종류를 고른 뒤 다음 복권을 구매하세요.</p>
  <div class="row" id="typeRow"></div>
  <p class="info" id="oddsInfo"></p>
  <div class="scratch-wrap">
    <canvas class="scratch" id="scratchCanvas" width="600" height="280"></canvas>
  </div>
  <div class="msg" id="scratchMsg"></div>
  <button class="btn" id="newTicket"></button>
</div>

<div id="predictPanel" class="panel">
  <p class="info">가상의 경기 결과로 진행되는 예측 게임이에요. 대회를 고르고 우승팀을 맞혀보세요.<br>1장 3,000원</p>
  <div class="sub">① 대회 선택</div>
  <div class="row" id="eventRow"></div>
  <div class="sub">② 우승팀 선택 (10팀 중 1팀)</div>
  <div class="row" id="teamRow"></div>
  <p class="info" id="predInfo"></p>
  <button class="btn" id="predBuy" disabled>예측 복권 구매 (3,000원)</button>
  <div class="msg" id="predMsg"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const won = n => n.toLocaleString('ko-KR') + '원';
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

/* 효과: 사운드, 흔들림, 컨페티 */
let actx = null;
function beep(freq = 660, dur = 0.15, type = 'square'){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g);
    g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }catch(e){}
}
function shakeScreen(){
  document.body.classList.remove('shake');
  void document.body.offsetWidth;
  document.body.classList.add('shake');
}
function confetti(power){
  const c = $('#fx');
  c.width = innerWidth;
  c.height = innerHeight;
  const g = c.getContext('2d');
  const ps = Array.from({length: power}, () => ({
    x: innerWidth / 2,
    y: innerHeight / 2,
    vx: (Math.random() - 0.5) * 18,
    vy: -Math.random() * 18 - 4,
    s: Math.random() * 8 + 4,
    col: `hsl(${Math.random() * 360},90%,60%)`,
    life: 120
  }));
  function step(){
    g.clearRect(0, 0, c.width, c.height);
    let alive = false;
    for(const p of ps){
      if(p.life <= 0) continue;
      alive = true;
      p.vy += 0.4;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      g.globalAlpha = Math.max(p.life / 120, 0);
      g.fillStyle = p.col;
      g.fillRect(p.x, p.y, p.s, p.s);
    }
    g.globalAlpha = 1;
    if(alive) requestAnimationFrame(step);
    else g.clearRect(0, 0, c.width, c.height);
  }
  step();
}
function celebrate(prize){
  if(prize >= 1000000){
    confetti(180);
    shakeScreen();
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle'), i * 140));
  } else if(prize > 0){
    confetti(70);
    beep(880, 0.2, 'triangle');
  } else {
    beep(180, 0.25, 'sawtooth');
  }
}

const START = 1000000;
const COST = 1000;
/* 로또 등수별 상금 (2개 이상 일치 시 당첨) */
const LOTTO_PRIZE = {1: 2800000000, 2: 5000000, 3: 1500000, 4: 50000, 5: 30000, 6: 5000};

/* 가중치 합 10000 기준. 0원 가중치 이외가 당첨 */
const TICKETS = [
  {id: 'basic', name: '행운 복권', cost: 1000, color: '#b8bcc6', text: '#6b6f7a', prizes: [
    {v: 0, w: 8045}, {v: 1000, w: 1200}, {v: 5000, w: 600}, {v: 50000, w: 150}, {v: 1000000, w: 5}
  ]},
  {id: 'gold', name: '황금 복권', cost: 5000, color: '#d4af37', text: '#5c4a10', prizes: [
    {v: 0, w: 8046}, {v: 5000, w: 1300}, {v: 20000, w: 500}, {v: 100000, w: 150}, {v: 5000000, w: 4}
  ]},
  {id: 'diamond', name: '다이아 복권', cost: 10000, color: '#9bd7f5', text: '#1e4a63', prizes: [
    {v: 0, w: 8468}, {v: 10000, w: 1200}, {v: 50000, w: 300}, {v: 300000, w: 30}, {v: 10000000, w: 2}
  ]}
];
const ticketById = id => TICKETS.find(t => t.id === id);
const LOSE_LINES = ['다음엔 될 거예요!', '아깝다… 한 번 더!', '행운이 곧 올 거예요', '꽝도 복권의 맛!'];

/* 예측 복권: 대회별 상금. 10팀 중 우승팀을 맞히면 당첨 (가상 결과) */
const EVENTS = [
  {id: 'olympic', name: '올림픽', icon: '🏅', prize: 500000},
  {id: 'asiad', name: '아시안게임', icon: '🌏', prize: 300000},
  {id: 'baseball', name: '야구', icon: '⚾', prize: 250000},
  {id: 'worldcup', name: '월드컵', icon: '⚽', prize: 1000000}
];
const TEAMS = ['한국', '일본', '미국', '중국', '독일', '브라질', '프랑스', '이탈리아', '스페인', '호주'];
const PREDICT_COST = 3000;
const eventById = id => EVENTS.find(e => e.id === id);

const hit = (s, n) => s.bestRank > 0 && s.bestRank <= n;
const MISSIONS = [
  {id: 'm1', title: '첫 추첨 해보기', reward: 10000, ok: s => s.draws >= 1},
  {id: 'm2', title: '복권 1장 긁기', reward: 10000, ok: s => s.scratches >= 1},
  {id: 'm3', title: '추첨 10회 달성', reward: 30000, ok: s => s.draws >= 10},
  {id: 'm4', title: '로또 4등 당첨', reward: 20000, ok: s => hit(s, 4)},
  {id: 'm5', title: '로또 3등 이상 당첨', reward: 300000, ok: s => hit(s, 3)},
  {id: 'm6', title: '로또 2등 이상 당첨', reward: 1000000, ok: s => hit(s, 2)},
  {id: 'm7', title: '로또 1등 당첨', reward: 10000000, ok: s => hit(s, 1)},
  {id: 'm8', title: '잔액 200만원 돌파', reward: 50000, ok: s => s.maxMoney >= 2000000},
  {id: 'm9', title: '황금 복권 긁기', reward: 30000, ok: s => s.byType.gold >= 1},
  {id: 'm10', title: '다이아 복권 긁기', reward: 100000, ok: s => s.byType.diamond >= 1},
  {id: 'm11', title: '예측 복권 적중', reward: 100000, ok: s => s.predHits >= 1},
  {id: 'm12', title: '예측 복권 10회 구매', reward: 50000, ok: s => s.predPlays >= 10}
];

function newState(){
  return {money: START, maxMoney: START, draws: 0, scratches: 0, bestRank: 0,
    byType: {basic: 0, gold: 0, diamond: 0}, predPlays: 0, predHits: 0, done: {}};
}
let S = newState();

/* 탭 전환 */
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === b.dataset.tab));
  };
});

/* 공통 처리 */
function updateMax(){ S.maxMoney = Math.max(S.maxMoney, S.money); }
function checkMissions(){
  const got = [];
  for(const m of MISSIONS){
    if(!S.done[m.id] && m.ok(S)){
      S.done[m.id] = true;
      S.money += m.reward;
      got.push(m);
    }
  }
  updateMax();
  return got;
}
function afterAction(extra){
  updateMax();
  const got = checkMissions();
  const parts = [];
  if(extra) parts.push(extra);
  if(got.length){
    parts.push('🎯 미션 완료! ' + got.map(m => `${m.title} +${won(m.reward)}`).join(', '));
    confetti(90);
    beep(1046, 0.25, 'triangle');
  }
  $('#toast').textContent = parts.join('  ');
  render();
}
function renderMissions(){
  $('#missionList').innerHTML = MISSIONS.map(m => {
    const done = !!S.done[m.id];
    return `<div class="mission ${done ? 'done' : ''}"><span>${done ? '✅' : '⬜'} ${m.title}</span><span>+${won(m.reward)}</span></div>`;
  }).join('');
}

/* 번호 추첨 */
const picks = new Set();
let drawing = false;
const grid = $('#grid');
for(let n = 1; n <= 45; n++){
  const b = document.createElement('button');
  b.className = 'num';
  b.textContent = n;
  b.onclick = () => togglePick(n);
  grid.appendChild(b);
}
function refreshGrid(){
  grid.querySelectorAll('.num').forEach(b => b.classList.toggle('sel', picks.has(+b.textContent)));
}
function togglePick(n){
  if(drawing) return;
  if(picks.has(n)) picks.delete(n);
  else if(picks.size < 6) picks.add(n);
  refreshGrid();
  render();
}
$('#autoBtn').onclick = () => {
  if(drawing) return;
  picks.clear();
  shuffle(Array.from({length: 45}, (_, i) => i + 1)).slice(0, 6).forEach(n => picks.add(n));
  refreshGrid();
  render();
};
$('#resetBtn').onclick = () => {
  if(drawing) return;
  picks.clear();
  $('#balls').innerHTML = '';
  $('#result').textContent = '';
  refreshGrid();
  render();
};
function makeBall(n, bonus){
  const d = document.createElement('div');
  d.className = `ball c${Math.ceil(n / 10)}` + (bonus ? ' bonus' : '');
  d.textContent = n;
  return d;
}
/* 등수 판정: 6개 일치=1등, 5개+보너스=2등, 5개=3등, 4개=4등, 3개=5등, 2개=6등 */
function rankOf(matched, bonusHit){
  if(matched === 6) return 1;
  if(matched === 5 && bonusHit) return 2;
  if(matched === 5) return 3;
  if(matched === 4) return 4;
  if(matched === 3) return 5;
  if(matched === 2) return 6;
  return 0;
}
async function draw(){
  if(picks.size !== 6 || drawing || S.money < COST) return;
  drawing = true;
  S.money -= COST;
  S.draws++;
  render();
  const balls = $('#balls');
  balls.innerHTML = '';
  $('#result').textContent = '추첨 중...';

  const pool = shuffle(Array.from({length: 45}, (_, i) => i + 1));
  const win = pool.slice(0, 6);
  const bonus = pool[6];
  for(const n of win){
    await sleep(500);
    balls.appendChild(makeBall(n, false));
    beep(440 + n * 6, 0.08, 'sine');
  }
  await sleep(700);
  balls.appendChild(makeBall(bonus, true));

  const matched = win.filter(n => picks.has(n)).length;
  const r = rankOf(matched, picks.has(bonus));
  const prize = LOTTO_PRIZE[r] || 0;
  S.money += prize;
  if(r && (!S.bestRank || r < S.bestRank)) S.bestRank = r;

  const label = r ? `${r}등 당첨! 일치 ${matched}개${r === 2 ? ' + 보너스' : ''}` : `꽝… 일치 ${matched}개`;
  $('#result').textContent = label + (prize ? `  +${won(prize)}` : '');
  celebrate(prize);
  drawing = false;
  afterAction();
}
$('#drawBtn').onclick = draw;

/* 복권 긁기 */
const cv = $('#scratchCanvas');
const ctx = cv.getContext('2d');
let scratching = false;
let pending = true;
let card = ticketById('basic');
let cardPrize = 0;
let selType = 'basic';

function pickPrize(t){
  const total = t.prizes.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for(const x of t.prizes){
    if((r -= x.w) < 0) return x.v;
  }
  return 0;
}
function resetScratch(t){
  card = t;
  cardPrize = pickPrize(t);
  pending = true;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = t.color;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = t.text;
  ctx.font = 'bold 40px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${t.name} 긁기`, cv.width / 2, cv.height / 2);
  cv.style.display = 'block';
  $('#scratchMsg').textContent = '';
}
function pos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * cv.width / r.width,
    y: (e.clientY - r.top) * cv.height / r.height
  };
}
function scratchAt(e){
  if(!pending) return;
  const p = pos(e);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
  ctx.fill();
}
function checkScratch(){
  if(!pending) return;
  const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let clear = 0, total = 0;
  for(let i = 3; i < d.length; i += 16){
    total++;
    if(d[i] === 0) clear++;
  }
  if(clear / total > 0.5){
    pending = false;
    cv.style.display = 'none';
    S.money += cardPrize;
    S.scratches++;
    S.byType[card.id]++;
    $('#scratchMsg').textContent = cardPrize
      ? `🎉 ${card.name} ${won(cardPrize)} 당첨!`
      : pickOne(LOSE_LINES);
    celebrate(cardPrize);
    afterAction();
  }
}
cv.addEventListener('pointerdown', e => {
  scratching = true;
  cv.setPointerCapture(e.pointerId);
  scratchAt(e);
});
cv.addEventListener('pointermove', e => { if(scratching) scratchAt(e); });
cv.addEventListener('pointerup', () => { scratching = false; checkScratch(); });
cv.addEventListener('pointercancel', () => { scratching = false; checkScratch(); });
$('#newTicket').onclick = () => {
  const t = ticketById(selType);
  if(pending || S.money < t.cost) return;
  S.money -= t.cost;
  resetScratch(t);
  afterAction();
};
function renderTypes(){
  const row = $('#typeRow');
  if(!row.children.length){
    TICKETS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'btn type-btn';
      b.dataset.id = t.id;
      b.onclick = () => {
        if(pending) return;
        selType = t.id;
        render();
      };
      row.appendChild(b);
    });
  }
  row.querySelectorAll('.type-btn').forEach(b => {
    const t = ticketById(b.dataset.id);
    b.textContent = `${t.name} ${won(t.cost)}`;
    b.classList.toggle('active', b.dataset.id === selType);
    b.disabled = pending;
  });
}

/* 예측 복권 */
let predEvent = null;
let predPick = null;
let predBusy = false;
function renderPredict(){
  const eRow = $('#eventRow');
  if(!eRow.children.length){
    EVENTS.forEach(ev => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.dataset.id = ev.id;
      b.textContent = `${ev.icon} ${ev.name}`;
      b.onclick = () => {
        if(predBusy) return;
        predEvent = ev.id;
        render();
      };
      eRow.appendChild(b);
    });
    const tRow = $('#teamRow');
    TEAMS.forEach((name, i) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.dataset.i = i;
      b.textContent = name;
      b.onclick = () => {
        if(predBusy) return;
        predPick = i;
        render();
      };
      tRow.appendChild(b);
    });
  }
  eRow.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.id === predEvent);
    b.disabled = predBusy;
  });
  $('#teamRow').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', +b.dataset.i === predPick);
    b.disabled = predBusy;
  });
  const ev = eventById(predEvent);
  $('#predInfo').textContent = ev
    ? `${ev.name} 우승팀 맞히기 · 적중 시 ${won(ev.prize)} · 적중 확률 10%`
    : '대회를 골라주세요';
  $('#predBuy').disabled = !ev || predPick === null || predBusy || S.money < PREDICT_COST;
}
$('#predBuy').onclick = async () => {
  const ev = eventById(predEvent);
  if(!ev || predPick === null || predBusy || S.money < PREDICT_COST) return;
  predBusy = true;
  S.money -= PREDICT_COST;
  S.predPlays++;
  $('#predMsg').textContent = '🏆 결과 집계 중...';
  render();
  await sleep(1500);
  const winner = Math.floor(Math.random() * TEAMS.length);
  const hitIt = winner === predPick;
  const prize = hitIt ? ev.prize : 0;
  S.money += prize;
  if(hitIt) S.predHits++;
  $('#predMsg').textContent = hitIt
    ? `🎉 적중! ${ev.name} 우승은 ${TEAMS[winner]} · +${won(prize)}`
    : `아쉽지만 빗나갔어요. ${ev.name} 우승은 ${TEAMS[winner]}`;
  celebrate(prize);
  predBusy = false;
  afterAction();
};

/* 화면 갱신 */
function render(){
  $('#money').textContent = won(S.money);
  renderMissions();
  const broke = S.money < COST;
  $('#bankrupt').textContent = broke ? '💸 잔액이 부족해요. 처음부터 버튼으로 다시 시작하세요.' : '';
  const list = [...picks].sort((a, b) => a - b).join(', ');
  $('#pickInfo').textContent = `선택한 번호 ${picks.size}/6  ${list}`;
  $('#drawBtn').disabled = picks.size !== 6 || drawing || broke;
  renderTypes();
  const t = ticketById(selType);
  const winPct = ((10000 - t.prizes[0].w) / 100).toFixed(1);
  $('#oddsInfo').textContent = `${t.name} 당첨 확률 약 ${winPct}% · 최고 ${won(Math.max(...t.prizes.map(p => p.v)))}`;
  $('#newTicket').textContent = `${t.name} 구매 (${won(t.cost)})`;
  $('#newTicket').disabled = pending || S.money < t.cost;
  renderPredict();
}

/* 처음부터 */
$('#resetAll').onclick = () => {
  if(drawing || predBusy) return;
  S = newState();
  picks.clear();
  refreshGrid();
  $('#balls').innerHTML = '';
  $('#result').textContent = '';
  $('#toast').textContent = '';
  $('#predMsg').textContent = '';
  predEvent = null;
  predPick = null;
  selType = 'basic';
  resetScratch(ticketById('basic'));
  render();
};

/* 초기화 */
resetScratch(ticketById('basic'));
render();
</script>
</body>
</html>
