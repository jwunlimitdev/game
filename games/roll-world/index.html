<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>굴려라! 별공 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b19;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:auto;padding:10px;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:clamp(19px,4vw,29px);margin:0}.sub{font-size:11px;color:#aeb8d6}
.stats{display:flex;gap:6px}.stat{background:#171e38;border:1px solid #303d65;border-radius:11px;padding:6px 10px;min-width:68px;text-align:center}.stat b{display:block;font-size:18px}.stat small{font-size:10px;color:#aeb8d6}
#stage{position:relative;flex:1;min-height:250px;overflow:hidden;border:1px solid #34436d;border-radius:17px;background:linear-gradient(#111b39,#26365b)}
#view{width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#070b1dcc;text-align:center;padding:18px}
#panel{max-width:430px;background:#151d38ed;border:1px solid #596b9c;border-radius:20px;padding:22px;box-shadow:0 18px 60px #0009}
#panel h2{font-size:27px;margin:0 0 8px}#panel p{color:#c0cbe7;line-height:1.65;font-size:14px}
button{border:0;border-radius:12px;background:#a8e4ff;color:#10203c;font-weight:850;padding:12px 22px;font-size:15px;cursor:pointer}
#bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#aeb8d6;font-size:11px}
#pad{display:none;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,35px);gap:5px}#pad button{padding:0;background:#26385f;color:white;border:1px solid #6279aa;touch-action:none}
@media(pointer:coarse){#pad{display:grid}#bottom .help{display:none}}
</style>
</head>
<body><div id="app">
<header><div><h1>🪐 굴려라! 별공 3D</h1><div class="sub">입체 세계를 누비며 물건을 모아 거대한 별공으로 성장!</div></div>
<div class="stats"><div class="stat"><b id="score">0</b><small>점수</small></div><div class="stat"><b id="size">1.0</b><small>크기</small></div><div class="stat"><b id="time">90</b><small>남은 시간</small></div></div></header>
<div id="stage"><div id="view"></div><div id="overlay"><div id="panel"><h2>별공을 굴려라!</h2><p>WASD 또는 방향키로 3D 공간을 이동하세요.<br>나보다 작은 물건에 가까이 가면 흡수합니다.<br>작은 물건부터 모아 점점 크게 성장하세요!</p><button id="start">게임 시작</button></div></div></div>
<div id="bottom"><span class="help">이동: WASD / 방향키 · 다시 시작: R</span><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><span>✨ 목표: 90초 안에 최고 점수!</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const host=document.querySelector('#view'),stage=document.querySelector('#stage'),ui={score:document.querySelector('#score'),size:document.querySelector('#size'),time:document.querySelector('#time'),overlay:document.querySelector('#overlay'),panel:document.querySelector('#panel')};
if(!window.THREE){ui.panel.innerHTML='<h2>3D 엔진을 불러오지 못했어요</h2><p>인터넷 연결을 확인한 뒤 다시 접속해 주세요.</p><button onclick="location.reload()">새로고침</button>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172447);scene.fog=new THREE.Fog(0x172447,32,85);
const camera=new THREE.PerspectiveCamera(58,1,.1,180);camera.position.set(0,12,17);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9dcff,0x34405c,2));
const sun=new THREE.DirectionalLight(0xfff0cf,2.3);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x26385b,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(100,50,0x6681b5,0x405477);grid.position.y=.012;scene.add(grid);
const boundary=new THREE.Mesh(new THREE.BoxGeometry(44,.35,44),new THREE.MeshStandardMaterial({color:0x334d78,wireframe:true,transparent:true,opacity:.28}));boundary.position.set(0,.1,0);scene.add(boundary);
const playerMat=new THREE.MeshStandardMaterial({color:0xf5bd54,metalness:.22,roughness:.25});
const player=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),playerMat);player.castShadow=true;player.position.y=1;scene.add(player);
const shine=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),new THREE.MeshBasicMaterial({color:0xfff6c9}));shine.position.set(-.3,.42,.82);player.add(shine);
const eyes=new THREE.Group();player.add(eyes);for(const x of [-.25,.25]){const e=new THREE.Mesh(new THREE.SphereGeometry(.09,12,10),new THREE.MeshBasicMaterial({color:0x30223a}));e.position.set(x,.16,.91);eyes.add(e)}
const mats=[0xff8fab,0xffd166,0x8bd3dd,0xc3a6ff,0x95e1a3,0xffad69,0xa0c4ff].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.38,metalness:.12}));
const geometries=[new THREE.DodecahedronGeometry(1,0),new THREE.BoxGeometry(1.5,1.5,1.5),new THREE.ConeGeometry(.85,1.6,6),new THREE.TorusKnotGeometry(.55,.18,40,8)];
let items=[],keys={},touch={},score=0,time=90,running=false,last=0,raf=0,vel=new THREE.Vector3(),worldSize=1;
function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(host);resize();
function makeItem(){const r=.28+Math.random()*.48,geo=geometries[Math.floor(Math.random()*geometries.length)],mesh=new THREE.Mesh(geo,mats[Math.floor(Math.random()*mats.length)]);mesh.scale.setScalar(r);mesh.position.set((Math.random()-.5)*39,r,(Math.random()-.5)*39);mesh.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);items.push({mesh,r,spin:.3+Math.random()})}
function updateUI(){ui.score.textContent=score.toLocaleString();ui.size.textContent=worldSize.toFixed(1);ui.time.textContent=Math.ceil(time)}
function reset(){for(const o of items)scene.remove(o.mesh);items=[];for(let i=0;i<100;i++)makeItem();player.position.set(0,1,0);player.scale.setScalar(1);player.rotation.set(0,0,0);vel.set(0,0,0);worldSize=1;score=0;time=90;updateUI()}
function start(){cancelAnimationFrame(raf);reset();running=true;ui.overlay.style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}
function end(){running=false;ui.overlay.style.display='grid';ui.panel.innerHTML='<h2>🏁 게임 종료!</h2><p>최종 점수 <b>'+score.toLocaleString()+'</b>점<br>최종 크기 <b>'+worldSize.toFixed(1)+'</b>배<br><br>'+(score>1800?'대단해요! 별공 마스터!':score>700?'멋진 수집 실력이에요!':'다음엔 더 크게 키워봐요!')+'</p><button id="again">다시 도전</button>';document.querySelector('#again').onclick=start}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;time-=dt;if(time<=0){time=0;updateUI();end();return}update(dt);renderer.render(scene,camera);updateUI();raf=requestAnimationFrame(loop)}
function update(dt){let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+(touch.right?1:0)-(touch.left?1:0),z=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+(touch.down?1:0)-(touch.up?1:0);const len=Math.hypot(x,z)||1;x/=len;z/=len;const speed=10/(1+worldSize*.12);vel.x+=(x*speed-vel.x)*Math.min(1,dt*6);vel.z+=(z*speed-vel.z)*Math.min(1,dt*6);player.position.x=THREE.MathUtils.clamp(player.position.x+vel.x*dt,-21+worldSize,21-worldSize);player.position.z=THREE.MathUtils.clamp(player.position.z+vel.z*dt,-21+worldSize,21-worldSize);player.position.y=worldSize;player.rotation.z-=vel.x*dt/worldSize;player.rotation.x+=vel.z*dt/worldSize;
for(let i=items.length-1;i>=0;i--){const o=items[i];o.mesh.rotation.y+=o.spin*dt;const d=player.position.distanceTo(o.mesh.position);if(o.r<worldSize*.88&&d<worldSize+o.r*.8){scene.remove(o.mesh);items.splice(i,1);score+=Math.round(o.r*100);worldSize=Math.min(4.8,Math.sqrt(worldSize*worldSize+o.r*o.r*.18));player.scale.setScalar(worldSize)}}
while(items.length<100)makeItem();
const target=new THREE.Vector3(player.position.x+vel.x*.3,player.position.y+worldSize*5+5,player.position.z+worldSize*7+8);camera.position.lerp(target,Math.min(1,dt*3));camera.lookAt(player.position.x,worldSize*.45,player.position.z)}
document.querySelector('#start').onclick=start;addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='r'&&!running)start()});addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
document.querySelectorAll('#pad button').forEach(b=>{const d=b.dataset.dir;const on=e=>{e.preventDefault();touch[d]=true},off=e=>{e.preventDefault();touch[d]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
reset();renderer.render(scene,camera);
})();
</script></body></html>
