<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>스네이크 디펜스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
#hud{display:flex;gap:16px;margin:8px 0;font-size:15px;flex-wrap:wrap;justify-content:center}
#hud b{color:#facc15}
#combo{color:#f97316;font-weight:800;min-width:70px;text-align:center}
canvas{background:#1e293b;border-radius:10px;width:min(94vw,520px);height:auto;touch-action:none}
#msg{margin-top:8px;font-size:14px;min-height:20px;color:#94a3b8;text-align:center}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:18px}
#overlay.show{display:flex}
button{padding:12px 28px;font-size:16px;border:0;border-radius:8px;background:#22c55e;color:#052e16;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="hud">
  <span>스테이지 <b id="stage">1</b></span>
  <span>먹이 <b id="eaten">0</b>/<b id="target">4</b></span>
  <span>점수 <b id="score">0</b></span>
  <span>최고 <b id="best">0</b></span>
  <span id="combo"></span>
</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg"></div>
<div id="overlay"><div id="over-text"></div><button id="restart">다시 시작</button></div>

<script>
const N = 20, CELL = 400 / N, TICK = 180;
const COMBO_WINDOW = 12; // 이 틱 안에 연속으로 먹으면 콤보
const HELP = '스와이프 또는 방향키로 이동 · 벽을 넘으면 반대편으로 · ⚡번개 🛡방패 🧲자석';
const ITEMS = { bolt: '⚡', shield: '🛡', magnet: '🧲' };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const key = (x, y) => x + ',' + y;
const rnd = n => Math.floor(Math.random() * n);
const wrap = v => ((v % N) + N) % N;
const px = v => v * CELL + CELL / 2;

let best = 0;
try { best = +localStorage.getItem('snakeDefenseBest') || 0; } catch (e) {}
$('best').textContent = best;

let S;

function init() {
  const start = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  S = {
    snake: start, prev: start.map(p => ({ ...p })), tickAt: performance.now(),
    dir: 'right', queue: [], food: null, items: [], obstacles: new Set(), enemies: [],
    stage: 1, eaten: 0, target: 4, score: 0, ticks: 0,
    shield: true, boltUntil: 0, magnetUntil: 0, over: false,
    combo: 0, lastEatTick: -999, fx: [], shake: 0, banner: null
  };
  makeStage();
  placeFood();
  $('overlay').classList.remove('show');
  msg(HELP);
}

function nearHead(x, y) {
  const h = S.snake[0];
  return Math.abs(x - h.x) + Math.abs(y - h.y) < 5;
}

function occupied(x, y) {
  return S.snake.some(s => s.x === x && s.y === y) ||
    S.obstacles.has(key(x, y)) ||
    (S.food && S.food.x === x && S.food.y === y) ||
    S.items.some(i => i.x === x && i.y === y) ||
    S.enemies.some(e => e.x === x && e.y === y);
}

function freeCell() {
  let x, y, t = 0;
  do { x = rnd(N); y = rnd(N); t++; } while ((occupied(x, y) || nearHead(x, y)) && t < 500);
  return { x, y };
}

function makeStage() {
  S.obstacles = new Set();
  const n = Math.min(2 + S.stage, 10);
  for (let i = 0; i < n; i++) { const p = freeCell(); S.obstacles.add(key(p.x, p.y)); }
  S.enemies = [];
  const ne = Math.min(Math.floor(S.stage / 2), 3);
  for (let i = 0; i < ne; i++) { const p = freeCell(); S.enemies.push(p); }
  S.target = 4 + (S.stage - 1) * 2;
  S.eaten = 0;
}

// 가끔 황금 사과가 나온다 (2개 먹은 효과 + 큰 점수)
function placeFood() {
  S.food = freeCell();
  S.food.gold = Math.random() < 0.18;
}

function spawnItem() {
  if (S.items.length >= 2) return;
  const p = freeCell();
  const types = Object.keys(ITEMS);
  S.items.push({ x: p.x, y: p.y, t: types[rnd(types.length)] });
}

function nextStage() {
  const bonus = 100 * S.stage;
  S.stage++;
  S.score += bonus;
  makeStage();
  placeFood();
  S.banner = { text: 'STAGE ' + S.stage, sub: '+' + bonus + ' 보너스', until: performance.now() + 1500 };
  burst(px(S.snake[0].x), px(S.snake[0].y), '#facc15', 24);
  flash('🎉 스테이지 ' + S.stage + ' 클리어 보너스 +' + bonus);
}

function moveEnemies() {
  S.enemies.forEach(e => {
    const h = S.snake[0];
    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([a, b]) => ({ x: e.x + a, y: e.y + b }))
      .filter(p => p.x >= 0 && p.y >= 0 && p.x < N && p.y < N &&
        !S.obstacles.has(key(p.x, p.y)) &&
        !S.enemies.some(o => o !== e && o.x === p.x && o.y === p.y));
    if (!opts.length) return;
    const dist = p => Math.abs(p.x - h.x) + Math.abs(p.y - h.y);
    opts.sort((a, b) => dist(a) - dist(b));
    const p = Math.random() < 0.4 ? opts[0] : opts[rnd(opts.length)];
    e.x = p.x; e.y = p.y;
  });
}

function pullFood(now) {
  if (now >= S.magnetUntil || !S.food) return;
  const hd = S.snake[0], f = S.food;
  if (Math.abs(f.x - hd.x) + Math.abs(f.y - hd.y) > 6) return;
  let nx = f.x, ny = f.y;
  if (Math.abs(f.x - hd.x) > Math.abs(f.y - hd.y)) nx += Math.sign(hd.x - f.x);
  else ny += Math.sign(hd.y - f.y);
  if (nx < 0 || ny < 0 || nx >= N || ny >= N) return;
  if (S.obstacles.has(key(nx, ny)) || S.snake.some(s => s.x === nx && s.y === ny)) return;
  S.food = { ...S.food, x: nx, y: ny };
}

function turn(d) {
  const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
  if (d !== last && d !== OPP[last]) S.queue.push(d);
  if (S.queue.length > 3) S.queue.shift();
}

function msg(t) { $('msg').textContent = t; }
let msgTimer;
function flash(t) {
  msg(t);
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msg(HELP), 1500);
}

/* ---------- 효과 (파티클, 떠오르는 글자, 화면 흔들림) ---------- */
function popText(x, y, t, color) {
  S.fx.push({ k: 't', x, y, t, c: color, life: 36, max: 36 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    S.fx.push({ k: 'p', x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, c: color, life: 26, max: 26 });
  }
}

function gameOver() {
  S.over = true;
  S.shake = 14;
  burst(px(S.snake[0].x), px(S.snake[0].y), '#ef4444', 20);
  if (S.score > best) {
    best = S.score;
    try { localStorage.setItem('snakeDefenseBest', best); } catch (e) {}
  }
  $('over-text').textContent = '게임 오버! 점수 ' + S.score + ' · 스테이지 ' + S.stage;
  $('overlay').classList.add('show');
}

function blockedByShield() {
  if (!S.shield) return false;
  S.shield = false;
  S.shake = 8;
  const h = S.snake[0];
  burst(px(h.x), px(h.y), '#60a5fa', 16);
  popText(px(h.x), px(h.y) - 10, '방패!', '#60a5fa');
  flash('🛡 방패가 막았어요!');
  return true;
}

function tick() {
  if (S.over) return;
  S.ticks++;
  S.prev = S.snake.map(p => ({ x: p.x, y: p.y }));
  S.tickAt = performance.now();
  const now = Date.now();
  if (S.queue.length) S.dir = S.queue.shift();
  if (S.ticks % 7 === 0) S.score += 1 * S.stage;
  if (S.ticks % 20 === 0) spawnItem();
  if (now >= S.boltUntil && S.ticks % 3 === 0) moveEnemies();

  const [dx, dy] = DIRS[S.dir];
  const hd = S.snake[0];
  const nx = wrap(hd.x + dx), ny = wrap(hd.y + dy);

  if (S.enemies.some(e => e.x === hd.x && e.y === hd.y)) {
    if (!blockedByShield()) return gameOver();
  }

  const eating = S.food && nx === S.food.x && ny === S.food.y;
  const body = eating ? S.snake : S.snake.slice(0, -1);
  const hitObs = S.obstacles.has(key(nx, ny));
  const hitBody = body.some(s => s.x === nx && s.y === ny);
  const hitEnemy = S.enemies.some(e => e.x === nx && e.y === ny);
  if (hitObs || hitBody || hitEnemy) {
    if (!blockedByShield()) return gameOver();
    return;
  }

  S.snake.unshift({ x: nx, y: ny });
  if (eating) {
    const gold = !!S.food.gold;
    // 콤보: 짧은 간격으로 연속 획득하면 배수 증가
    if (S.ticks - S.lastEatTick <= COMBO_WINDOW) S.combo++;
    else S.combo = 1;
    S.lastEatTick = S.ticks;
    const mult = Math.min(S.combo, 5);
    const pts = (gold ? 50 : 10) * S.stage * mult;
    S.eaten += gold ? 2 : 1;
    S.score += pts;
    burst(px(nx), px(ny), gold ? '#facc15' : '#f87171', gold ? 20 : 12);
    popText(px(nx), px(ny) - 8, '+' + pts, gold ? '#facc15' : '#fde68a');
    if (mult > 1) flash('🔥 ' + mult + '배 콤보!');
    S.food = null;
    if (S.eaten >= S.target) nextStage();
    else placeFood();
  } else {
    S.snake.pop();
  }

  const idx = S.items.findIndex(i => i.x === nx && i.y === ny);
  if (idx >= 0) {
    const t = S.items[idx].t;
    S.items.splice(idx, 1);
    if (t === 'bolt') S.boltUntil = now + 6000;
    if (t === 'shield') S.shield = true;
    if (t === 'magnet') S.magnetUntil = now + 7000;
    burst(px(nx), px(ny), '#a78bfa', 14);
    popText(px(nx), px(ny) - 8, ITEMS[t], '#e9d5ff');
    flash(ITEMS[t] + (t === 'bolt' ? ' 번개! 적 정지' : t === 'shield' ? ' 방패 획득' : ' 자석 발동'));
  }

  pullFood(now);
}

/* ---------- 렌더링 ---------- */

// 이동 사이 보간: 칸 단위 이동을 부드럽게 이어 붙인다 (벽을 넘는 순간은 보간하지 않음)
function snakePoints(t) {
  return S.snake.map((s, i) => {
    const f = S.prev[Math.min(i, S.prev.length - 1)] || s;
    let x = f.x, y = f.y;
    if (Math.abs(s.x - f.x) <= 1 && Math.abs(s.y - f.y) <= 1) {
      x = f.x + (s.x - f.x) * t;
      y = f.y + (s.y - f.y) * t;
    } else {
      x = s.x; y = s.y;
    }
    return { x: x * CELL + CELL / 2, y: y * CELL + CELL / 2 };
  });
}

// 머리에서 꼬리로 갈수록 가늘어짐
function widthAt(i, n) {
  const k = n <= 1 ? 0 : i / (n - 1);
  return CELL * (0.92 - 0.6 * Math.pow(k, 0.8));
}

function drawSnake(t, now) {
  const pts = snakePoints(t);
  const n = pts.length;

  // 1) 바깥 윤곽 (꼬리 → 머리 순서)
  for (let i = n - 1; i >= 0; i--) {
    const r = widthAt(i, n) / 2;
    ctx.fillStyle = '#0c2410';
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, r + 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2) 몸통 기본색 (배 쪽은 밝게, 등은 올리브 그린)
  for (let i = n - 1; i >= 0; i--) {
    const r = widthAt(i, n) / 2;
    const g = ctx.createRadialGradient(
      pts[i].x - r * 0.35, pts[i].y - r * 0.35, r * 0.1,
      pts[i].x, pts[i].y, r
    );
    g.addColorStop(0, '#9fd16a');
    g.addColorStop(0.6, '#5f9a3a');
    g.addColorStop(1, '#3b6b26');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3) 등 무늬 (마름모 얼룩을 번갈아 배치)
  for (let i = 2; i < n - 1; i++) {
    if (i % 2) continue;
    const r = widthAt(i, n) / 2;
    const a = pts[i - 1], b = pts[i + 1];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    ctx.save();
    ctx.translate(pts[i].x, pts[i].y);
    ctx.rotate(ang);
    ctx.fillStyle = 'rgba(30,70,20,.75)';
    ctx.beginPath();
    ctx.moveTo(r * 0.6, 0);
    ctx.lineTo(0, -r * 0.7);
    ctx.lineTo(-r * 0.6, 0);
    ctx.lineTo(0, r * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 4) 비늘 하이라이트
  for (let i = 1; i < n; i++) {
    const r = widthAt(i, n) / 2;
    ctx.fillStyle = 'rgba(220,255,190,.18)';
    ctx.beginPath();
    ctx.arc(pts[i].x - r * 0.25, pts[i].y - r * 0.25, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  drawHead(pts, now);
}

function drawHead(pts, now) {
  const h = pts[0];
  const nk = pts[1] || { x: h.x - 1, y: h.y };
  const ang = Math.atan2(h.y - nk.y, h.x - nk.x);
  const r = widthAt(0, pts.length) / 2;

  // 보호막 표시 (은은하게 맥동)
  if (S.shield) {
    const pulse = 0.6 + 0.4 * Math.sin(now / 150);
    ctx.strokeStyle = 'rgba(96,165,250,' + pulse + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r + 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(ang);

  // 혀 (살짝살짝 날름)
  const flick = Math.sin(now / 110) > 0.2;
  if (flick) {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(r * 0.9, 0);
    ctx.lineTo(r * 1.5, 0);
    ctx.moveTo(r * 1.5, 0);
    ctx.lineTo(r * 1.9, -r * 0.35);
    ctx.moveTo(r * 1.5, 0);
    ctx.lineTo(r * 1.9, r * 0.35);
    ctx.stroke();
  }

  // 머리 본체 (타원)
  const hg = ctx.createRadialGradient(-r * 0.2, -r * 0.3, r * 0.1, 0, 0, r * 1.1);
  hg.addColorStop(0, '#a8e070');
  hg.addColorStop(0.7, '#5f9a3a');
  hg.addColorStop(1, '#2f5a1d');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.05, r * 0.82, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#0c2410';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 콧구멍
  ctx.fillStyle = '#163310';
  ctx.beginPath();
  ctx.arc(r * 0.82, -r * 0.2, r * 0.07, 0, Math.PI * 2);
  ctx.arc(r * 0.82, r * 0.2, r * 0.07, 0, Math.PI * 2);
  ctx.fill();

  // 눈 (노란 홍채 + 세로 동공)
  [-1, 1].forEach(side => {
    const ex = r * 0.25, ey = side * r * 0.5;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(ex, ey, r * 0.27, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.ellipse(ex + r * 0.03, ey, r * 0.07, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(ex - r * 0.06, ey - r * 0.08, r * 0.05, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

function text(t, x, y) {
  ctx.fillText(t, px(x), px(y));
}

function drawFood(now) {
  const f = S.food;
  if (!f) return;
  if (f.gold) {
    const pulse = 0.5 + 0.5 * Math.sin(now / 200);
    ctx.fillStyle = 'rgba(250,204,21,' + (0.25 + 0.2 * pulse) + ')';
    ctx.beginPath();
    ctx.arc(px(f.x), px(f.y), CELL * 0.6, 0, Math.PI * 2);
    ctx.fill();
    text('🍏', f.x, f.y);
  } else {
    text('🍎', f.x, f.y);
  }
}

function drawFx() {
  S.fx.forEach(f => {
    const a = f.life / f.max;
    ctx.globalAlpha = a;
    if (f.k === 'p') {
      f.x += f.vx;
      f.y += f.vy;
      f.vx *= 0.9; f.vy *= 0.9;
      ctx.fillStyle = f.c;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 2.5 * a + 1, 0, Math.PI * 2);
      ctx.fill();
    } else {
      f.y -= 0.6;
      ctx.fillStyle = f.c;
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText(f.t, f.x, f.y);
    }
    f.life--;
  });
  ctx.globalAlpha = 1;
  S.fx = S.fx.filter(f => f.life > 0);
}

function drawBanner(now) {
  const b = S.banner;
  if (!b || now > b.until) return;
  const a = Math.min(1, (b.until - now) / 400);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(b.text, 200, 180);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText(b.sub, 200, 212);
  ctx.globalAlpha = 1;
}

function render() {
  const now = performance.now();
  const t = Math.min(1, (now - S.tickAt) / TICK);

  ctx.save();
  // 화면 흔들림
  if (S.shake > 0) {
    const m = S.shake;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    S.shake = Math.max(0, S.shake - 1);
  }

  ctx.clearRect(-20, -20, 440, 440);
  if (Date.now() < S.boltUntil) {
    ctx.fillStyle = 'rgba(250,204,21,.12)';
    ctx.fillRect(0, 0, 400, 400);
  }
  ctx.fillStyle = '#475569';
  S.obstacles.forEach(k => {
    const [x, y] = k.split(',').map(Number);
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  });

  ctx.font = (CELL * 0.8) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  drawFood(now);
  S.items.forEach(i => text(ITEMS[i.t], i.x, i.y));
  S.enemies.forEach(e => text('🐭', e.x, e.y));

  drawSnake(t, now);
  drawFx();
  ctx.textAlign = 'center';
  drawBanner(now);

  ctx.restore();

  $('stage').textContent = S.stage;
  $('eaten').textContent = S.eaten;
  $('target').textContent = S.target;
  $('score').textContent = S.score;
  const comboNow = S.ticks - S.lastEatTick <= COMBO_WINDOW && S.combo > 1;
  $('combo').textContent = comboNow ? '🔥 x' + Math.min(S.combo, 5) : '';
  requestAnimationFrame(render);
}

/* ---------- 입력 ---------- */

addEventListener('keydown', e => {
  if (KEYS[e.key]) { turn(KEYS[e.key]); e.preventDefault(); }
});

let sx = 0, sy = 0;
cv.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left');
  else turn(dy > 0 ? 'down' : 'up');
});

$('restart').onclick = () => { init(); };

init();
requestAnimationFrame(render);
setInterval(tick, TICK);
</script>
</body>
</html>
