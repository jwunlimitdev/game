<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>조용한 낚시터</title>
<link rel='stylesheet' href='style.css?v=5'>
</head>
<body>
<header><a href='../'>← 홈</a><h1>조용한 낚시터</h1><span></span></header>
<canvas id='c' width='360' height='480'></canvas>
<div class='hud'><span>코인 <b id='coins'>0</b></span><span>콤보 <b id='combo'>0</b> · 최고 <b id='best'>0</b></span></div>
<div class='eqline' id='eq'></div>
<div class='sbox'>
  <div class='sinfo' id='stageInfo'></div>
  <div class='sbar'><i id='stageBar'></i></div>
</div>
<div id='msg'></div>
<div class='stages' id='stages'></div>
<div class='btns'>
  <button id='act' class='main act'>던지기</button>
</div>
<div class='btns'>
  <button id='up' class='main'></button>
  <button id='rod' class='main'></button>
</div>
<div class='btns'>
  <button id='gachaBtn' class='main'>🎰 장비 뽑기</button>
  <button id='invBtn' class='main'>📦 인벤토리</button>
</div>
<div class='dex'>
  <div class='dex-title'><span>도감</span><span id='dexCount'></span></div>
  <div class='bar'><i id='dexBar'></i></div>
  <ul id='dexList'></ul>
</div>
<div class='modal' id='gacha' hidden>
  <div class='mbox'>
    <div class='mhead'><b>장비 뽑기</b><button id='gClose' class='main sm'>닫기</button></div>
    <canvas id='claw' width='360' height='300'></canvas>
    <div id='gmsg'></div>
    <button id='gStart' class='main act'>뽑기 (150코인)</button>
  </div>
</div>
<div class='modal' id='inv' hidden>
  <div class='mbox'>
    <div class='mhead'><b>내 장비 인벤토리</b><span id='invCount'></span><button id='invClose' class='main sm'>닫기</button></div>
    <div class='dex' style='margin:0;max-height:60vh;overflow:auto'><ul id='invList'></ul></div>
  </div>
</div>
<script src='data.js?v=5'></script>
<script src='game.js?v=5'></script>
<script src='claw.js?v=5'></script>
</body>
</html>
