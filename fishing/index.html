<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>조용한 낚시터</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<header><a href='../'>← 홈</a><h1>조용한 낚시터</h1><span></span></header>

  <div class='bar'><i id='dexBar'></i></div>
  <ul id='dexList'></ul>

<script src='data.js'></script>
<script src='game.js'></script>
